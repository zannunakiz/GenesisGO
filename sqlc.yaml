version: "2"
sql:
  - schema: "migrations/"
    queries: "internal/store/queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "store"
        out: "internal/store"
        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_optional_fields_for_nullable_columns: true
        emit_result_struct_pointers: false
        emit_methods_with_argument_name: false
        emit_pointers_for_null_types: false
        emit_prepared_queries: false
        emit_exported_queries: true
        emit_tags_for_table_rename: false
        omit_unused_interface_methods: true
        emit_empty_slices: true
        emit_done_methods: false
